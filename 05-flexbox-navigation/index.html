<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弹性盒子制作导航框</title>
    <style>
        .wrap {
            width: 1200px;
            height: 66px;
            margin: 0 auto;
            flex-wrap: wrap;
            display: flex;
            justify-content: space-between;
        }

        .box {
            display: flex;
            background: rgb(227, 229, 231);
            border-radius: 5px;
            flex-basis: 100px;
            margin-top: 5px;
            margin-bottom: 5px;
            margin-right: 5px;
            justify-content: center;
            align-items: center;
            color: rgb(24, 25, 28);
            height: 30px;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="box">番剧</div>
        <div class="box">国创</div>
        <div class="box">综艺</div>
        <div class="box">动画</div>
        <div class="box">鬼畜</div>
        <div class="box">舞蹈</div>
        <div class="box">娱乐</div>
        <div class="box">科技数码</div>
        <div class="box">美食</div>
        <div class="box">汽车</div>
        <div class="box">体育运动</div>
        <div class="box">电影</div>
        <div class="box">电视剧</div>
        <div class="box">纪录片</div>
        <div class="box">游戏</div>
        <div class="box">音乐</div>
        <div class="box">影视</div>
        <div class="box">知识</div>
        <div class="box">资讯</div>
        <div class="box">小剧场</div>
        <div class="box">时尚美妆</div>
        <div class="box">更多</div>
    </div>
</body>

</html>
